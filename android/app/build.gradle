plugins { id 'com.android.application' }

android {
    namespace 'dev.archaeopteryx.lanshare'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.archaeopteryx.lanshare'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The same web UI the Windows app uses
    sourceSets { main { assets.srcDirs = ['../../shared'] } }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
